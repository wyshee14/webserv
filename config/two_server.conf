server {
    listen 8080;
    listen 127.127.127.0:9000;
    root data/;
    index index.html;
    autoindex on;
    client_max_body_size 1M;
    error_page 500 401 403 error4xx.html;
    error_page 500 error5xx.html;
    location / {
        root config;
        allowed_methods GET;
        return 301 /path;
    }
    location /images{
        index indesx.html;
    }
}

server {
    listen 127.127.127.0:7000;
    listen 10.255.255.254:9090;
    root data/;
    index index.html;
    autoindex on;
    client_max_body_size 1M;
    error_page 500 401 403 error4xx.html;
    error_page 500 error5xx.html;
    location / {
        root config;
        allowed_methods GET;
        return 301 /path;
    }
    location /images{
        index indesx.html;
    }
}
