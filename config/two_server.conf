server {
    listen 8080;
    root data/;
    index index.html;
    autoindex on;
    client_max_body_size 1M;
    error_page 500 401 403 error4xx.html;
    error_page 500 error5xx.html;
    location / {
        root config;
        allowed_methods GET;
        return 301 /path;
    }
    location /images{
        index indesx.html;
    }
}

server {
    listen 127:0:0:0 8080;
    location /images{
        root data/images;
    }
}
